// wii.cfg: executed by the Wii boot command line after the engine's own
// defaults. Copy this file to <dev>:/newgame/<basegame>/wii.cfg.
//
// Joystick key names: JOY_* is seat 1, 2JOY_* seat 2, 3JOY_* seat 3,
// 4JOY_* seat 4. The GameCube layout in code/wii/wii_input.c maps:
//   A -> JOY_A, B -> JOY_B, X -> JOY_X, Y -> JOY_Y, Z -> JOY_RIGHTSHOULDER,
//   START -> JOY_START, L click -> JOY_LEFTSHOULDER, R click -> JOY_BACK,
//   D-pad -> JOY_DPAD_*, L/R analog -> JOY_LEFTTRIGGER / JOY_RIGHTTRIGGER,
//   main stick -> JOY_LEFTSTICK_* (analog move), C-stick -> JOY_RIGHTSTICK_* (analog look)
//
// Spearmint routes a command to a seat by its NAME, not by the key it is
// bound to: "+attack" and "weapnext" always act on seat 1, seat 2 uses
// "+2attack" and "2weapnext", seat 3 "+3attack", seat 4 "+4attack"
// (see Com_LocalPlayerCvarName). Binding a 2JOY_* key to "+attack" makes
// pad 2 fire for player 1. Only a few UI commands (togglemenu) are global.

// ---- seat 1 ----
bind JOY_RIGHTTRIGGER "+attack"
bind JOY_LEFTTRIGGER "+zoom"
bind JOY_A "+moveup"
bind JOY_B "+movedown"
bind JOY_X "weapnext"
bind JOY_Y "weapprev"
bind JOY_RIGHTSHOULDER "+button2"
bind JOY_START "togglemenu"
bind JOY_DPAD_UP "+scores"
bind JOY_LEFTSTICK_UP "+forward"
bind JOY_LEFTSTICK_DOWN "+back"
bind JOY_LEFTSTICK_LEFT "+moveleft"
bind JOY_LEFTSTICK_RIGHT "+moveright"
bind JOY_RIGHTSTICK_UP "+lookup"
bind JOY_RIGHTSTICK_DOWN "+lookdown"
bind JOY_RIGHTSTICK_LEFT "+left"
bind JOY_RIGHTSTICK_RIGHT "+right"

// ---- seat 2 ----
bind 2JOY_RIGHTTRIGGER "+2attack"
bind 2JOY_LEFTTRIGGER "+2zoom"
bind 2JOY_A "+2moveup"
bind 2JOY_B "+2movedown"
bind 2JOY_X "2weapnext"
bind 2JOY_Y "2weapprev"
bind 2JOY_RIGHTSHOULDER "+2button2"
bind 2JOY_START "togglemenu"
bind 2JOY_DPAD_UP "+2scores"
bind 2JOY_LEFTSTICK_UP "+2forward"
bind 2JOY_LEFTSTICK_DOWN "+2back"
bind 2JOY_LEFTSTICK_LEFT "+2moveleft"
bind 2JOY_LEFTSTICK_RIGHT "+2moveright"
bind 2JOY_RIGHTSTICK_UP "+2lookup"
bind 2JOY_RIGHTSTICK_DOWN "+2lookdown"
bind 2JOY_RIGHTSTICK_LEFT "+2left"
bind 2JOY_RIGHTSTICK_RIGHT "+2right"

// ---- seat 3 ----
bind 3JOY_RIGHTTRIGGER "+3attack"
bind 3JOY_LEFTTRIGGER "+3zoom"
bind 3JOY_A "+3moveup"
bind 3JOY_B "+3movedown"
bind 3JOY_X "3weapnext"
bind 3JOY_Y "3weapprev"
bind 3JOY_RIGHTSHOULDER "+3button2"
bind 3JOY_START "togglemenu"
bind 3JOY_DPAD_UP "+3scores"
bind 3JOY_LEFTSTICK_UP "+3forward"
bind 3JOY_LEFTSTICK_DOWN "+3back"
bind 3JOY_LEFTSTICK_LEFT "+3moveleft"
bind 3JOY_LEFTSTICK_RIGHT "+3moveright"
bind 3JOY_RIGHTSTICK_UP "+3lookup"
bind 3JOY_RIGHTSTICK_DOWN "+3lookdown"
bind 3JOY_RIGHTSTICK_LEFT "+3left"
bind 3JOY_RIGHTSTICK_RIGHT "+3right"

// ---- seat 4 ----
bind 4JOY_RIGHTTRIGGER "+4attack"
bind 4JOY_LEFTTRIGGER "+4zoom"
bind 4JOY_A "+4moveup"
bind 4JOY_B "+4movedown"
bind 4JOY_X "4weapnext"
bind 4JOY_Y "4weapprev"
bind 4JOY_RIGHTSHOULDER "+4button2"
bind 4JOY_START "togglemenu"
bind 4JOY_DPAD_UP "+4scores"
bind 4JOY_LEFTSTICK_UP "+4forward"
bind 4JOY_LEFTSTICK_DOWN "+4back"
bind 4JOY_LEFTSTICK_LEFT "+4moveleft"
bind 4JOY_LEFTSTICK_RIGHT "+4moveright"
bind 4JOY_RIGHTSTICK_UP "+4lookup"
bind 4JOY_RIGHTSTICK_DOWN "+4lookdown"
bind 4JOY_RIGHTSTICK_LEFT "+4left"
bind 4JOY_RIGHTSTICK_RIGHT "+4right"

// ---- analog look speed per seat (degrees per second at full deflection) ----
seta cg_yawspeedanalog 200
seta cg_pitchspeedanalog 140
seta 2cg_yawspeedanalog 200
seta 2cg_pitchspeedanalog 140
seta 3cg_yawspeedanalog 200
seta 3cg_pitchspeedanalog 140
seta 4cg_yawspeedanalog 200
seta 4cg_pitchspeedanalog 140

// ---- splitscreen and quality defaults tuned for the Wii ----
seta cg_splitviewVertical 0
seta cg_splitviewThirdEqual 1
seta cg_splitviewTextScale 2
seta cg_shadows 0
seta cg_marks 0
seta cg_brassTime 0
seta cg_drawFPS 0
seta r_lodbias 1
seta r_picmip 1
seta r_texturebits 16
seta com_maxfps 30

// The first seat plays as soon as a map loads; other pads join by pressing
// START (see IN_CheckDropIn in code/wii/wii_input.c), or use these directly:
//   2dropin, 3dropin, 4dropin / 2dropout, 3dropout, 4dropout
// To start with all four seats from the console: set cl_localPlayers 15; map <name>
