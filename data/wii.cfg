// wii.cfg: executed by the Wii boot command line after the engine's own
// defaults. Copy this file to <dev>:/newgame/<basegame>/wii.cfg.
//
// Joystick key names: JOY_* is seat 1, 2JOY_* seat 2, 3JOY_* seat 3,
// 4JOY_* seat 4. The GameCube layout in code/wii/wii_input.c maps:
//   A -> JOY_A, B -> JOY_B, X -> JOY_X, Y -> JOY_Y, Z -> JOY_RIGHTSHOULDER,
//   START -> JOY_START, L click -> JOY_LEFTSHOULDER, R click -> JOY_BACK,
//   D-pad -> JOY_DPAD_*, L/R analog -> JOY_LEFTTRIGGER / JOY_RIGHTTRIGGER,
//   main stick -> JOY_LEFTSTICK_* (analog move), C-stick -> JOY_RIGHTSTICK_* (analog look)

// ---- seat 1 ----
bind JOY_RIGHTTRIGGER "+attack"
bind JOY_LEFTTRIGGER "+zoom"
bind JOY_A "+moveup"
bind JOY_B "+movedown"
bind JOY_X "weapnext"
bind JOY_Y "weapprev"
bind JOY_RIGHTSHOULDER "+button2"
bind JOY_START "togglemenu"
bind JOY_DPAD_UP "+scores"
bind JOY_LEFTSTICK_UP "+forward"
bind JOY_LEFTSTICK_DOWN "+back"
bind JOY_LEFTSTICK_LEFT "+moveleft"
bind JOY_LEFTSTICK_RIGHT "+moveright"
bind JOY_RIGHTSTICK_UP "+lookup"
bind JOY_RIGHTSTICK_DOWN "+lookdown"
bind JOY_RIGHTSTICK_LEFT "+left"
bind JOY_RIGHTSTICK_RIGHT "+right"

// ---- seat 2 ----
bind 2JOY_RIGHTTRIGGER "+attack"
bind 2JOY_LEFTTRIGGER "+zoom"
bind 2JOY_A "+moveup"
bind 2JOY_B "+movedown"
bind 2JOY_X "weapnext"
bind 2JOY_Y "weapprev"
bind 2JOY_RIGHTSHOULDER "+button2"
bind 2JOY_START "togglemenu"
bind 2JOY_DPAD_UP "+scores"
bind 2JOY_LEFTSTICK_UP "+forward"
bind 2JOY_LEFTSTICK_DOWN "+back"
bind 2JOY_LEFTSTICK_LEFT "+moveleft"
bind 2JOY_LEFTSTICK_RIGHT "+moveright"
bind 2JOY_RIGHTSTICK_UP "+lookup"
bind 2JOY_RIGHTSTICK_DOWN "+lookdown"
bind 2JOY_RIGHTSTICK_LEFT "+left"
bind 2JOY_RIGHTSTICK_RIGHT "+right"

// ---- seat 3 ----
bind 3JOY_RIGHTTRIGGER "+attack"
bind 3JOY_LEFTTRIGGER "+zoom"
bind 3JOY_A "+moveup"
bind 3JOY_B "+movedown"
bind 3JOY_X "weapnext"
bind 3JOY_Y "weapprev"
bind 3JOY_RIGHTSHOULDER "+button2"
bind 3JOY_START "togglemenu"
bind 3JOY_DPAD_UP "+scores"
bind 3JOY_LEFTSTICK_UP "+forward"
bind 3JOY_LEFTSTICK_DOWN "+back"
bind 3JOY_LEFTSTICK_LEFT "+moveleft"
bind 3JOY_LEFTSTICK_RIGHT "+moveright"
bind 3JOY_RIGHTSTICK_UP "+lookup"
bind 3JOY_RIGHTSTICK_DOWN "+lookdown"
bind 3JOY_RIGHTSTICK_LEFT "+left"
bind 3JOY_RIGHTSTICK_RIGHT "+right"

// ---- seat 4 ----
bind 4JOY_RIGHTTRIGGER "+attack"
bind 4JOY_LEFTTRIGGER "+zoom"
bind 4JOY_A "+moveup"
bind 4JOY_B "+movedown"
bind 4JOY_X "weapnext"
bind 4JOY_Y "weapprev"
bind 4JOY_RIGHTSHOULDER "+button2"
bind 4JOY_START "togglemenu"
bind 4JOY_DPAD_UP "+scores"
bind 4JOY_LEFTSTICK_UP "+forward"
bind 4JOY_LEFTSTICK_DOWN "+back"
bind 4JOY_LEFTSTICK_LEFT "+moveleft"
bind 4JOY_LEFTSTICK_RIGHT "+moveright"
bind 4JOY_RIGHTSTICK_UP "+lookup"
bind 4JOY_RIGHTSTICK_DOWN "+lookdown"
bind 4JOY_RIGHTSTICK_LEFT "+left"
bind 4JOY_RIGHTSTICK_RIGHT "+right"

// ---- analog look speed per seat (degrees per second at full deflection) ----
seta cg_yawspeedanalog 200
seta cg_pitchspeedanalog 140
seta 2cg_yawspeedanalog 200
seta 2cg_pitchspeedanalog 140
seta 3cg_yawspeedanalog 200
seta 3cg_pitchspeedanalog 140
seta 4cg_yawspeedanalog 200
seta 4cg_pitchspeedanalog 140

// ---- splitscreen and quality defaults tuned for the Wii ----
seta cg_splitviewVertical 0
seta cg_splitviewThirdEqual 1
seta cg_splitviewTextScale 2
seta cg_shadows 0
seta cg_marks 0
seta cg_brassTime 0
seta cg_drawFPS 0
seta r_lodbias 1
seta r_picmip 1
seta r_texturebits 16
seta com_maxfps 30

// The first seat plays as soon as a map loads; other pads join by pressing
// START (see IN_CheckDropIn in code/wii/wii_input.c), or use these directly:
//   2dropin, 3dropin, 4dropin / 2dropout, 3dropout, 4dropout
// To start with all four seats from the console: set cl_localPlayers 15; map <name>
